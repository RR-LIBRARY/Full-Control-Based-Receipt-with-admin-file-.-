<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RR Library - Master Admin</title>
  
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --primary: #6366f1;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --gray: #64748b;
      --text: #f8fafc; --text-muted: #94a3b8;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; font-size: 14px; }
    
    /* LOGIN */
    #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(10px); }
    .login-box { background: var(--card-bg); padding: 40px; border-radius: 24px; text-align: center; width: 90%; max-width: 380px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .login-input { width: 100%; padding: 16px; margin: 25px 0; border-radius: 12px; border: 1px solid #334155; background: #020617; color: white; text-align: center; font-size: 18px; outline: none; }
    .login-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; font-weight: 800; cursor: pointer; font-size: 16px; }

    /* DASHBOARD */
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
    .brand h1 { margin: 0; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; color: transparent; font-size: 28px; }

    /* TOOLBAR & FILTERS */
    .toolbar-wrapper { background: var(--card-bg); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    
    .toolbar { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; }
    
    .search-box { flex: 2; position: relative; min-width: 200px; }
    .search-box input { width: 100%; padding: 12px 15px 12px 40px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 10px; outline: none; box-sizing: border-box; }
    .search-box::after { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
    
    .filter-select { padding: 12px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 10px; outline: none; flex: 1; min-width: 140px; cursor: pointer; }
    #filterMonth { border-color: var(--primary); background: #1e1b4b; color: #c7d2fe; font-weight: bold; }

    .btn-export { padding: 12px 25px; background: #065f46; color: #a7f3d0; border: 1px solid #059669; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }

    /* LIVE ANALYSIS STRIP */
    .analysis-strip { display: flex; gap: 20px; padding-top: 15px; border-top: 1px dashed #334155; overflow-x: auto; }
    .analysis-item { display: flex; flex-direction: column; min-width: 120px; }
    .ana-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .ana-val { font-size: 18px; font-weight: 800; color: white; }
    .ana-green { color: #34d399; } .ana-red { color: #f87171; }

    /* TABLE */
    .table-container { overflow-x: auto; background: var(--card-bg); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); min-height: 400px; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 14px; }
    th { text-align: left; padding: 15px; background: #1e293b; color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 700; border-bottom: 2px solid #334155; }
    td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
    
    .status-badge { padding: 6px 12px; border-radius: 30px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .st-approved { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .st-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .st-rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .st-left { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .action-btn { padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; margin-right: 6px; }
    .btn-verify { background: var(--success); color: #022c22; }
    .btn-reject { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid #ef4444; }
    .btn-left { background: #334155; color: #cbd5e1; border: 1px solid #475569; }
    
    .btn-view-proof { background: #3b82f6; color: white; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-size: 12px; border: 1px solid #2563eb; cursor: pointer; }
    .btn-view-proof:hover { background: #2563eb; }
    .download-badge { background: #0f172a; padding: 4px 10px; border-radius: 6px; border: 1px solid #334155; color: #94a3b8; font-family: monospace; }
    .high-download { color: #f59e0b; border-color: #f59e0b; font-weight: bold; }

    /* PIN BUTTON */
    .btn-pin { background: transparent; border: 1px solid #6366f1; color: #6366f1; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; margin-left: 5px; }
    .btn-pin:hover { background: #6366f1; color: white; }

    /* TOAST */
    #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 14px; }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

  </style>
</head>
<body>

  <!-- TOAST NOTIFICATION -->
  <div id="toast">Notification Message</div>

  <!-- LOGIN -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2 style="color:white; margin-bottom:5px;">RR Admin</h2>
      <input type="password" id="adminPass" class="login-input" placeholder="Password">
      <button class="login-btn" onclick="checkLogin()">Login</button>
      <p id="errorMsg" style="color:#ef4444; font-size:13px; margin-top:15px; display:none;">Incorrect Password</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="container" id="mainDashboard">
    
    <div class="header">
      <div class="brand">
        <h1>RR Digital Library</h1>
        <span>Analytics Dashboard</span>
      </div>
      <button onclick="logout()" style="background:#334155; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">Log Out</button>
    </div>

    <!-- FILTER & ANALYSIS SECTION -->
    <div class="toolbar-wrapper">
      <!-- Filters -->
      <div class="toolbar">
        <select id="filterMonth" class="filter-select" onchange="applyFilters()">
          <option value="All">📅 All Months</option>
          <option value="January">January</option>
          <option value="February">February</option>
          <option value="March">March</option>
          <option value="April">April</option>
          <option value="May">May</option>
          <option value="June">June</option>
          <option value="July">July</option>
          <option value="August">August</option>
          <option value="September">September</option>
          <option value="October">October</option>
          <option value="November">November</option>
          <option value="December">December</option>
        </select>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search Student..." onkeyup="applyFilters()">
        </div>
        
        <select id="filterStatus" class="filter-select" onchange="applyFilters()">
          <option value="All">All Status</option>
          <option value="Pending">⚠️ Pending Request</option>
          <option value="Approved">✅ Approved</option>
          <option value="Rejected">❌ Rejected</option>
          <option value="Left">🚫 Left Student</option>
        </select>

        <select id="filterShift" class="filter-select" onchange="applyFilters()">
          <option value="All">All Shifts</option>
          <option value="Full Day (Subah se Sham)">Full Day (Subah se Sham)</option>
          <option value="Half Day (Morning)">Half Day (Morning)</option>
          <option value="Half Day (Afternoon)">Half Day (Afternoon)</option>
          <option value="Half Day (Evening)">Half Day (Evening)</option>
          <option value="Full Time (24 Hours)">Full Time (24 Hours)</option>
          <option value="Night Shift">Night Shift</option>
        </select>
        
        <button class="btn-export" onclick="exportToExcel()">📥 Export View</button>
      </div>

      <!-- LIVE ANALYSIS -->
      <div class="analysis-strip">
        <div class="analysis-item">
          <span class="ana-label">Visible Students</span>
          <span class="ana-val" id="anaCount">0</span>
        </div>
        <div class="analysis-item">
          <span class="ana-label">Filtered Revenue</span>
          <span class="ana-val ana-green" id="anaRevenue">₹ 0</span>
        </div>
        <div class="analysis-item">
          <span class="ana-label">Filtered Dues</span>
          <span class="ana-val ana-red" id="anaDue">₹ 0</span>
        </div>
        <div class="analysis-item">
          <span class="ana-label">Current View</span>
          <span class="ana-val" style="color:#f59e0b" id="anaView">All Months</span>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Student Name</th>
            <th>Mobile / PIN</th>
            <th>Payment Proof</th>
            <th>Shift & Seat</th>
            <th>Fees / Due</th>
            <th>Downloads</th>
            <th>Status</th>
            <th>Controls</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="9" style="text-align:center; padding:40px; color:#64748b;">Loading Data...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB-ASbQxHidySZu_GSdpQ76FDP6VyYLHpA",
    authDomain: "rr-library-app.firebaseapp.com",
    projectId: "rr-library-app",
    storageBucket: "rr-library-app.firebasestorage.app",
    messagingSenderId: "123565860952",
    appId: "1:123565860952:web:173792c579b2463b02c22d",
    measurementId: "G-VJQPDD2JW9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  let allReceipts = []; 
  let currentFilteredData = []; 
  const monthMap = { "January": 1, "February": 2, "March": 3, "April": 4, "May": 5, "June": 6, "July": 7, "August": 8, "September": 9, "October": 10, "November": 11, "December": 12 };

  // --- LOGIN ---
  window.checkLogin = function() {
    const p = document.getElementById("adminPass").value;
    if(p === "rrlibrary91") {
      sessionStorage.setItem("rrAdmin", "loggedIn");
      initDashboard();
    } else {
      document.getElementById("errorMsg").style.display = "block";
    }
  }

  if(sessionStorage.getItem("rrAdmin") === "loggedIn") initDashboard();

  function initDashboard() {
      document.getElementById("loginOverlay").style.display = "none";
      document.getElementById("mainDashboard").style.display = "block";
  }
  
  window.logout = function() { sessionStorage.clear(); location.reload(); }

  function makeReceiptNo() { 
      const d = new Date(); 
      return `RR-${d.getFullYear()}${(d.getMonth()+1).toString().padStart(2,'0')}${d.getDate()}-${d.getHours()}${d.getMinutes()}`; 
  }

  function showToast(msg, type="success") {
      const x = document.getElementById("toast");
      x.innerText = msg;
      x.style.backgroundColor = type === "success" ? "#10b981" : "#ef4444";
      x.className = "show";
      setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
  }

  // --- DATA FETCH ---
  onSnapshot(query(collection(db, "receipts"), orderBy("timestamp", "desc")), (snapshot) => {
    allReceipts = [];
    snapshot.forEach((doc) => {
      const d = doc.data();
      d.id = doc.id;
      allReceipts.push(d);
    });
    applyFilters();
  });

  // --- FILTER & RENDER ---
  window.applyFilters = function() {
    const fMonth = document.getElementById("filterMonth").value;
    const fStatus = document.getElementById("filterStatus").value;
    const fShift = document.getElementById("filterShift").value;
    const searchVal = document.getElementById("searchInput").value.toLowerCase();
    
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    // FILTER LOGIC
    let filtered = allReceipts.filter(d => {
       let mMatch = (fMonth === "All") || (d.month && d.month === fMonth);
       let sMatch = false;
       if(fStatus === "All") sMatch = true;
       else if(fStatus === "Pending" && (d.status === "Pending" || d.status === "auto-generated")) sMatch = true;
       else if(d.status === fStatus) sMatch = true;
       let shMatch = (fShift === "All") || (d.shift === fShift);
       let searchMatch = !searchVal || (d.studentName && d.studentName.toLowerCase().includes(searchVal)) || (d.mobile && d.mobile.includes(searchVal));

       return mMatch && sMatch && shMatch && searchMatch;
    });

    currentFilteredData = filtered;

    // SORTING
    filtered.sort((a, b) => {
        const monthA = monthMap[a.month] || 13;
        const monthB = monthMap[b.month] || 13;
        if (monthA !== monthB) return monthA - monthB;
        return b.timestamp - a.timestamp;
    });

    // UPDATE ANALYSIS
    let totalRev = 0;
    let totalDue = 0;
    filtered.forEach(d => {
        if(d.status === "Approved") totalRev += (Number(d.amount) || 0);
        if(d.paymentDue > 0) totalDue += (Number(d.paymentDue) || 0);
    });

    document.getElementById("anaCount").innerText = filtered.length;
    document.getElementById("anaRevenue").innerText = "₹ " + totalRev.toLocaleString("en-IN");
    document.getElementById("anaDue").innerText = "₹ " + totalDue.toLocaleString("en-IN");
    document.getElementById("anaView").innerText = fMonth === "All" ? "All Months" : fMonth;

    if(filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#64748b;">No data found.</td></tr>`;
        return;
    }

    // RENDER TABLE
    filtered.forEach(d => {
        let badgeClass = "st-pending";
        if(d.status === "Approved") badgeClass = "st-approved";
        if(d.status === "Rejected") badgeClass = "st-rejected";
        if(d.status === "Left") badgeClass = "st-left";

        let actions = "";
        if(d.status === "Pending" || d.status === "auto-generated") {
            actions = `
              <button class="action-btn btn-verify" onclick="updateStatus('${d.id}', 'Approved')">Verify</button>
              <button class="action-btn btn-reject" onclick="updateStatus('${d.id}', 'Rejected')">Reject</button>
            `;
        } else if (d.status === "Approved") {
            actions = `
              <button class="action-btn btn-left" onclick="updateStatus('${d.id}', 'Left')">Mark Left</button>
            `;
        } else {
            actions = `<span style="font-size:11px; color:#64748b;">${d.status}</span>`;
        }

        // Base64 Image Logic
        let proofHtml = `<span style="color:#64748b; font-size:11px;">No Upload</span>`;
        if(d.screenshotUrl) {
            proofHtml = `<button onclick="showImage('${d.id}')" class="btn-view-proof">📷 View Proof</button>
                         <div id="img-${d.id}" style="display:none;">${d.screenshotUrl}</div>`;
        }

        // Downloads Logic
        let dlCount = d.downloadCount || 0;
        let dlClass = dlCount > 5 ? "download-badge high-download" : "download-badge";

        const row = `
          <tr>
            <td style="color:#94a3b8; font-size:12px;">${d.dateTime.split(',')[0]}<br><span style="color:#6366f1">${d.month || '-'}</span></td>
            <td style="color:white; font-weight:bold;">${d.studentName}</td>
            <td style="font-family:monospace; color:#cbd5e1;">
               ${d.mobile}
               <button class="btn-pin" onclick="managePin('${d.id}', '${d.secretPin}')">PIN: ${d.secretPin}</button>
            </td>
            <td>${proofHtml}</td>
            <td>
               <div style="color:#e2e8f0; font-size:13px;">${d.shift}</div>
               <span style="color:#f59e0b; font-size:11px;">Seat: ${d.seatNo || '-'}</span>
            </td>
            <td>
                <div style="color:#10b981; font-weight:bold;">₹${d.amount}</div>
                ${d.paymentDue > 0 ? `<div style="color:#ef4444; font-size:12px;">Due: ₹${d.paymentDue}</div>` : ''}
            </td>
            <td style="text-align:center;">
                <span class="${dlClass}">${dlCount} times</span>
            </td>
            <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
            <td>${actions}</td>
          </tr>
        `;
        tbody.innerHTML += row;
    });
  }

  // --- SHOW IMAGE (POPUP) ---
  window.showImage = function(id) {
    const imgData = document.getElementById(`img-${id}`).innerText;
    const win = window.open();
    win.document.write(`<img src="${imgData}" style="max-width:100%;">`);
  }

  // --- PIN MANAGEMENT ---
  window.managePin = async (id, currentPin) => {
      const choice = prompt(`Current PIN: ${currentPin}\n\nType 'RESET' to change PIN to 1234, or 'CANCEL' to exit.`);
      if(choice === "RESET") {
          await updateDoc(doc(db, "receipts", id), { secretPin: "1234" });
          showToast("PIN Reset to 1234");
      }
  }

  // --- EXPORT TO EXCEL ---
  window.exportToExcel = function() {
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Date,Month,Name,Mobile,Shift,Seat,Amount,Due,Downloads,Status\n"; 

      currentFilteredData.forEach(d => {
          let row = `${d.dateTime.split(',')[0]},${d.month},${d.studentName},${d.mobile},${d.shift},${d.seatNo},${d.amount},${d.paymentDue},${d.downloadCount || 0},${d.status}`;
          csvContent += row + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `RR_Library_${document.getElementById("filterMonth").value}_Data.csv`);
      document.body.appendChild(link);
      link.click();
      showToast("📊 Data Exported!");
  }

  // --- UPDATE STATUS ---
  window.updateStatus = async (id, newStatus) => {
      let confirmMsg = "";
      if(newStatus === 'Approved') confirmMsg = "Confirm Payment & Verify Student?";
      else if(newStatus === 'Rejected') confirmMsg = "Reject this Request?";
      else if(newStatus === 'Left') confirmMsg = "Mark this student as LEFT (Inactive)?";

      if(confirm(confirmMsg)) {
          const docRef = doc(db, "receipts", id);
          const updateData = { status: newStatus };
          
          if(newStatus === "Approved") {
              updateData.receiptNo = makeReceiptNo();
              showToast("Student Verified ✅");
          } else if(newStatus === "Left") {
              showToast("Marked as Left 🚫");
          } else {
              showToast("Student Rejected ❌", "error");
          }
          
          await updateDoc(docRef, updateData);
      }
  }
</script>
</body>
</html>
